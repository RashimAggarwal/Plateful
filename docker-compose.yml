services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in the project .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the project .env file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-10000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: ${API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
